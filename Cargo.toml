[package]
name = "juicebar"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "把无线键鼠的电量常驻在 Windows 任务栏，不必打开厂商 hub"
license = "MIT"

# 程序本体。**关掉它的单元测试二进制**（`test = false`，main.rs 里也没有用例）：`build.rs` 给 bin 目标嵌了
# 要求管理员权限的程序清单，而 bin 自己的单元测试二进制在 Cargo 眼里也是 bin 目标——它一带上清单，
# 非管理员跑 `cargo test` 就会以 os error 740 起不来。
[[bin]]
name = "juicebar"
path = "src/main.rs"
test = false

[dependencies]

# Windows 原生 API，这个项目的两条数据来源都落在它上面：
#   Win32_Devices_HumanInterfaceDevice —— HidD_* / HidP_*，2.4G 私有协议靠它开 collection、收发报文
#   Win32_Devices_DeviceAndDriverInstallation —— CM_Get_Device_ID_ListW / CM_Locate_DevNodeW /
#       CM_Get_DevNode_PropertyW，枚举设备并读蓝牙电量属性。走 Config Manager 而不是 SetupAPI，
#       是因为前者不用维护 HDEVINFO 句柄，且读 DEVPKEY 时普通用户权限就够（裸注册表的
#       Properties 子键 ACL 只给 SYSTEM，读不到）
#   Win32_Devices_Properties —— DEVPROPKEY / DEVPROPTYPE，上一条的入参类型
#   Win32_Storage_FileSystem + Win32_System_IO + Win32_Security —— CreateFileW/ReadFile/WriteFile
#       打开并读写 HID 设备句柄
#   Win32_System_Diagnostics_ToolHelp —— CreateToolhelp32Snapshot / Process32FirstW / Process32NextW，
#       枚举本机在跑的进程，用来认出厂商上位机并让开 HID 通路。选 Toolhelp 而不是
#       Win32_System_ProcessStatus 的 EnumProcesses，是因为后者只给 PID，名字还要逐个
#       OpenProcess 去问，而那一步对系统进程会失败——一份缺项的名单，症状恰好是"暂停有时不触发"
#   Win32_Graphics_Gdi —— CreateCompatibleDC / CreateDIBSection / CreateFontW / TextOutW，托盘图标的
#       字形选"系统字体"时，让 Windows 把数字画在一块内存位图上（src/icon/system_font.rs）。选 GDI
#       而不是 DirectWrite：只画几个数字、要的只是一张灰度覆盖率，GDI 不用起 COM、不用 D2D 渲染目标。
#       托盘外壳也用它：CreateBitmap / CreateDIBSection 造出图标的颜色位图与掩码位图
#   Win32_UI_WindowsAndMessaging —— 托盘外壳的那扇看不见的窗口、消息循环、计时器、右键菜单，以及把
#       渲染器画好的位图做成图标（CreateIconIndirect）。托盘图标的回调只投给一扇窗口，没有窗口就没有托盘
#   Win32_UI_Shell —— Shell_NotifyIconW：把图标放进任务栏通知区、改它、删它（src/shell/icon.rs）
#   Win32_System_LibraryLoader —— GetModuleHandleW，注册窗口类要的那个模块句柄
#   Win32_System_Registry —— RegGetValueW，读任务栏此刻是深色还是浅色（Personalize 下的
#       SystemUsesLightTheme）。Windows 没给这件事一个 API，那个注册表值就是它公开的答案
#   Win32_UI_HiDpi —— GetDpiForSystem，按显示缩放给图标选尺寸（icon::IconSize::for_dpi）
#   Win32_System_Console —— AttachConsole：程序是窗口程序（双击不闪黑框），过渡期的 status 与
#       config-refresh 借启动它的那个终端印字（src/main.rs）
# 选 windows 而不是 windows-sys：HID 那一层要传 PHIDP_PREPARSED_DATA 这类不透明句柄并配对释放，
# 有类型包装能少写一批 unsafe。
windows = { version = "0.62.2", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_System_Console"] }

# 子命令 status / scan / probe / run。derive 是为了让子命令定义和帮助文本住在一处。
clap = { version = "4.6.6", features = ["derive"] }

# 配置文件（设备清单、身份合并规则、主设备选择）。选 TOML 是因为配置要人手写、要带注释——
# 首次运行自动生成的草稿里有大量「这一项我猜不出来，你自己填」的提示，JSON 放不下注释。
# %APPDATA% 下那份状态文件（上次已知读数）也走这一套，读和写都走：它是程序自己写自己读的
# 缓存，没有注释和格式要保，所以不必动用下面的 toml_edit。跟着配置用同一种格式是顺带的好处
# ——不为一份缓存再收一个序列化库。
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"

# 格式保留的 TOML 原地编辑，见 docs/adr/0003。程序要往用户手写的配置里补东西
# （`config-refresh` 填空着的 Endpoint 块，以及 `primary` 的回写，见 `config::pin_primary`），
# 而 serde 那套的序列化会把整份文件重新写一遍、洗掉全部注释——这份配置的价值有一半在注释里。
# 只有**写用户手写的那份配置**用它；读配置仍然走 `toml` + serde（读要的是类型化的模型而不是
# 文档树），而状态文件那一份读写都走 serde——那里没有注释要保。
toml_edit = "0.25.13"

# 错误传播。这是个单人自用工具，调用方只有 main，不需要给错误分类型，anyhow 的上下文链就够。
anyhow = "1.0.104"
